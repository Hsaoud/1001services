<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratoire audio — La Duchesse</title>
    <style>
      :root {
        --bg: #fbf3ef;
        --card: #fffaf7;
        --ink: #4a3b3f;
        --muted: #8d7a7f;
        --rose: #e9b7b4;
        --rose-deep: #c98a8a;
        --gold: #b8893b;
        --gold-soft: #f1dfb8;
        --sage: #a9bfa6;
        --line: #ecd9d3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 'Cormorant Garamond', Georgia, serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-weight: 600;
        font-size: 28px;
        margin: 0 0 4px;
        color: var(--gold);
        letter-spacing: 0.02em;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 18px;
        font-size: 15px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        margin: 0 0 14px;
        box-shadow: 0 2px 10px rgba(201, 138, 138, 0.08);
      }
      h2 {
        font-size: 17px;
        margin: 0 0 10px;
        color: var(--rose-deep);
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      button {
        font: 600 13px/1 system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--rose);
        border-radius: 999px;
        padding: 8px 13px;
        cursor: pointer;
        transition: background 0.12s, transform 0.06s;
      }
      button:hover {
        background: #fdeceb;
      }
      button:active {
        transform: scale(0.97);
      }
      button.primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #fff;
      }
      button.on {
        background: var(--rose);
        color: #fff;
        border-color: var(--rose-deep);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
      }
      .row.intensity {
        margin-top: 10px;
      }
      .meter-row {
        margin-top: 10px;
      }
      .meter {
        position: relative;
        width: 320px;
        max-width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #f3e4df;
        overflow: hidden;
      }
      .meter .fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--sage), var(--gold));
      }
      .meter::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--peak, 0%);
        width: 2px;
        background: var(--rose-deep);
      }
      .meter-txt {
        font: 12px ui-monospace, Consolas, monospace;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 7px;
        margin-top: 12px;
      }
      .grid button {
        border-radius: 10px;
        text-align: left;
        padding: 9px 10px;
        font-weight: 500;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
      }
      label.slider {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 13px system-ui, sans-serif;
        color: var(--muted);
      }
      label.slider output {
        min-width: 38px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      input[type='range'] {
        accent-color: var(--gold);
        width: 150px;
      }
      #status {
        font: 12px ui-monospace, Consolas, monospace;
        color: var(--muted);
        margin-left: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font: 12px ui-monospace, Consolas, monospace;
        margin-top: 10px;
      }
      th,
      td {
        text-align: left;
        padding: 4px 6px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td.warn {
        color: #c0392b;
        font-weight: 700;
      }
      canvas.env {
        display: block;
        background: #fdf6f3;
        border-radius: 4px;
      }
      .hint {
        font: 12px system-ui, sans-serif;
        color: var(--muted);
      }
      .scroll {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main id="lab"></main>
    <script type="module" src="/src/audio/lab.ts"></script>
  </body>
</html>
