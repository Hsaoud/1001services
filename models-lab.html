<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Labo des modèles — La Duchesse</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6e7e4;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #3d2a22;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #icons {
        position: fixed;
        left: 8px;
        top: 8px;
        display: flex;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 12px;
        background: rgba(255, 250, 244, 0.85);
        box-shadow: 0 2px 10px rgba(122, 46, 58, 0.15);
      }
      #icons figure {
        margin: 0;
        text-align: center;
        font-size: 10px;
      }
      #icons img {
        width: 64px;
        height: 64px;
        display: block;
        background: repeating-conic-gradient(#f3e3df 0 25%, #fff 0 50%) 0 0 / 12px 12px;
        border-radius: 8px;
      }
      #ui {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 290px;
        overflow-y: auto;
        padding: 10px 12px 40px;
        box-sizing: border-box;
        background: rgba(255, 250, 244, 0.93);
        border-left: 1px solid #ecd3cd;
        font-size: 12px;
      }
      #ui h3 {
        margin: 14px 0 6px;
        font-size: 13px;
        color: #7a2e3a;
        border-bottom: 1px solid #ecd3cd;
        padding-bottom: 3px;
      }
      #ui button {
        margin: 2px;
        padding: 3px 7px;
        border: 1px solid #d9b0b5;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        color: #5b1f2a;
      }
      #ui button.on {
        background: #7a2e3a;
        color: #fff;
      }
      #ui label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin: 2px 6px 2px 0;
      }
      #ui input[type='range'] {
        width: 150px;
      }
      #hint {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font-size: 11px;
        opacity: 0.75;
        background: rgba(255, 250, 244, 0.8);
        padding: 4px 8px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="icons"></div>
    <div id="ui"></div>
    <div id="hint">Glisser : orbite · Molette : zoom · ZQSD/WASD/flèches : déplacer le joueur · Espace : Pas Chassé · 1-5 : vues · H : panneau · URL #look=poodle&amp;act=leap&amp;h=1.5&amp;ui=0</div>
    <script type="module" src="/src/render/models/lab.ts"></script>
  </body>
</html>
