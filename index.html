    />
    <style>
      /* Badge « Powered by Netlify » masqué */
      #nl-badge-frame,
      iframe[title='Powered by Netlify'],
      .netlify-badge {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Badge de l'hébergeur (Netlify) : masqué s'il est présent ou ajouté dynamiquement.
      (function () {
        var SEL = '#nl-badge-frame, iframe[title="Powered by Netlify"], .netlify-badge';
        var hide = function () {
          var els = document.querySelectorAll(SEL);
          for (var i = 0; i < els.length; i++) {
            els[i].style.setProperty('display', 'none', 'important');
            try {
              els[i].remove();
            } catch (e) {}
          }
        };
        hide();
        var mo = new MutationObserver(hide);
        mo.observe(document.body, { childList: true });
        mo.observe(document.documentElement, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
